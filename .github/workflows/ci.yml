name: CI

on:
  push:
    branches:
    - "**"
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Just
      uses: extractions/setup-just@v2

    - name: Setup XcodeGen and xcbeautify
      run: brew install xcodegen xcbeautify

    - name: Build project
      run: just build

    - name: Run unit and UI tests
      run: just test
